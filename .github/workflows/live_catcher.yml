name: Trigger Live Chat Catcher

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Paste the YouTube Video ID (e.g., tc-DND7R8I0)'
        required: true
        type: string

jobs:
  capture_live_match:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Initialize System Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google API Core Libraries
      run: |
        pip install google-api-python-client

    - name: Fire Live Parsing Ingestion Pipeline
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        YOUTUBE_VIDEO_ID: ${{ inputs.video_id }}
      run: python catch_live_chat.py

    - name: Auto Commit Clean Dataset Modifications
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add final_unified_dataset.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "data: append cloud live chat data streams for ID ${{ inputs.video_id }}" && git push)
